---
version: 2.1

orbs:
  browser-tools: circleci/browser-tools@2.4.0
  coveralls: coveralls/coveralls@2.2.5
commands:
  bundle_install:
    description: "Install correct version of bundler and load from cache or bundle install"
    steps:
      # Restore bundle cache
      - restore_cache:
          keys:
            - pdc_describe-{{ checksum "Gemfile.lock" }}-{{ checksum "yarn.lock" }}
      - run:
          name: Update bundler
          command: |
            echo 'export BUNDLER_VERSION=4.0.23' >> $BASH_ENV
            gem install bundler -v 4.0.23
      - run:
          name: Set bundler path
          command: bundle config set path 'vendor/bundle'
      - run:
          name: Bundle install
          command: bundle check || bundle install --jobs 4 --retry 3
      - save_cache:
          key: pdc_describe-{{ checksum "Gemfile.lock" }}-{{ checksum "yarn.lock" }}
          paths:
            - ./vendor/bundle
  yarn_install:
    description: "Install the supported release of Yarn and install the package dependencies"
    steps:
      - restore_cache:
          name: Restore the Yarn package dependencies from the cache
          keys:
            - pdc_describe-yarn-{{ checksum "yarn.lock" }}
      - run:
          name: Install NPM Dependencies via Yarn
          command: yarn install --immutable
      - save_cache:
          name: Save Yarn Package Cache
          key: pdc_describe-yarn-{{ checksum "yarn.lock" }}
          paths:
            - ~/.cache/yarn

jobs:
  build:
    working_directory: ~/pdc_describe
    docker:
      - &ruby_docker
        image: cimg/ruby:4.0.9-browsers
        environment:
          RAILS_ENV: test
    steps:
      - checkout
      - run: sudo apt update && sudo apt install postgresql-client libmsgpack-dev
      - bundle_install
      - yarn_install
      - persist_to_workspace:
          root: &root "~/pdc_describe"
          paths: "*"

  style_check:
    working_directory: *root
    docker:
      - *ruby_docker
    steps:
      - attach_workspace:
          at: *root
      - run:
          name: Run standardrb
          command: bundle exec standardrb
      - run:
          name: Run eslint
          command: yarn run eslint 'app/assets/javascripts/**' 'app/javascript/**'
      - run:
          name: Run prettier
          command: yarn run prettier --check .

  test:
    working_directory: *root
    docker:
      - *ruby_docker
      - image: postgres:15-alpine
        environment:
          POSTGRES_USER: pdc_describe_user
          POSTGRES_DB: test_db
          POSTGRES_HOST_AUTH_METHOD: trust
    steps:
      - attach_workspace:
          at: *root
      - run:
          name: Wait for PostgreSQL
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
      - run: bundle exec rake db:create RAILS_ENV=test
      - run: bundle exec rake db:migrate RAILS_ENV=test
      - run:
          name: Run Rspec
          command: bundle exec rspec spec
      - store_artifacts:
          path: ~/pdc_describe/coverage
      - coveralls/upload

workflows:
  version: 2
  build_accept_deploy:
    jobs:
      - build
      - test:
          requires:
            - build
      - style_check:
          requires:
            - build
